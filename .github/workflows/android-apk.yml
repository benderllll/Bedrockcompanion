name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'BedrockCompanion-Mobile-Android-Project.zip'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unpack project
        run: unzip -o BedrockCompanion-Mobile-Android-Project.zip -d project
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle -p project assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BedrockCompanion-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error